name: External Audio Build
# Builds the additive external-audio feature branch.

on:
  push:
    branches:
      - feature/external-audio-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify dual-source UI is inside the APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p /tmp/apkcheck
          mkdir -p /tmp/apkcheck/dex
          unzip -q "$APK" 'classes*.dex' -d /tmp/apkcheck/dex
          : > /tmp/apkcheck/classes.strings
          for dex in /tmp/apkcheck/dex/classes*.dex; do
            strings "$dex" >> /tmp/apkcheck/classes.strings
          done
          for needle in "Audio Source" "Add Audio Account" "Server URL" "Audio Channel" "Remove Audio" "Reconnect Audio" "Account Name"; do
            grep -F "$needle" /tmp/apkcheck/classes.strings >/dev/null || {
              echo "APK verification failed: missing '$needle' in all DEX files"
              exit 1
            }
          done
          echo "APK verification passed: required Dual Source UI strings are embedded in the APK."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-external-audio-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
