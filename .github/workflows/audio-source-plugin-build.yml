name: Audio Source Plugin Build

on:
  workflow_dispatch:
  push:
    paths:
      - "plugin-audio-source/**"
      - "settings.gradle.kts"
      - "gradle/**"

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin APK
        run: ./gradlew --console=plain :plugin-audio-source:assembleDebug
      - name: Verify APK exists
        run: test -s plugin-audio-source/build/outputs/apk/debug/plugin-audio-source-debug.apk
      - name: Upload plugin APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-Audio-Source-Plugin-debug
          path: plugin-audio-source/build/outputs/apk/debug/*.apk
