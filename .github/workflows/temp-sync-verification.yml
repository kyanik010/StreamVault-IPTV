name: Temporary Sync Verification

on:
  push:
    branches:
      - fix/xtream-sync-from-368-final

permissions:
  contents: read

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare existing #368 launcher resource for CI build
        run: |
          mkdir -p app/src/main/res/drawable
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<bitmap xmlns:android="http://schemas.android.com/apk/res/android" android:src="@drawable/eagle_x_activation_logo" />' > app/src/main/res/drawable/eagle_x_launcher.xml
      - name: Compile and build debug APK
        run: ./gradlew --console=plain :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sync-verification-apk
          path: app/build/outputs/apk/debug/*.apk
