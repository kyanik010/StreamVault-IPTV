name: Temporary Sync Verification

on:
  push:
    branches:
      - fix/xtream-sync-from-368-final

permissions:
  contents: read

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --console=plain :data:test
      - name: Build debug APK
        run: ./gradlew --console=plain :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sync-verification-apk
          path: app/build/outputs/apk/debug/*.apk
