name: Dual Source Build

on:
  push:
    branches:
      - master
      - feature/dual-source-audio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --console=plain testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --console=plain :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: streamvault-dual-source-debug
          path: app/build/outputs/apk/debug/*.apk
