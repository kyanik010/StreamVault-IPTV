name: Apply Eagle X2 UI on #223 baseline

on:
  push:
    branches:
      - feature/eagle-x2-ui-on-223

permissions:
  contents: write

jobs:
  apply-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI-only section from design commit
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/com/streamvault/app/activation/ActivationGate.kt"
          DESIGN_COMMIT="b6b300206cfb0428cdb9a3d385279a31de46fba2"
          git fetch origin "$DESIGN_COMMIT" --no-tags
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          file_path = Path("app/src/main/java/com/streamvault/app/activation/ActivationGate.kt")
          current = file_path.read_text(encoding="utf-8")
          design = subprocess.check_output([
              "git", "show",
              "b6b300206cfb0428cdb9a3d385279a31de46fba2:app/src/main/java/com/streamvault/app/activation/ActivationGate.kt"
          ]).decode("utf-8")

          # Keep the #223 activation/trial/device-ID logic exactly as it is.
          # Copy only the imports required by the approved Eagle X2 Compose UI.
          current_enum = "internal enum class ActivationState"
          design_enum = "internal enum class ActivationState"
          current_prefix = current.split(current_enum, 1)[0]
          design_prefix = design.split(design_enum, 1)[0]
          current = design_prefix + current[len(current_prefix):]

          ui_start = "// ===== Activation screen UI: Eagle X2 \"pass\" design. UI only, no activation logic in this section. ====="
          ui_end = "// ===== End of UI section. Everything below is unchanged activation / trial / device-id logic. ====="
          design_ui = design.split(ui_start, 1)[1].split(ui_end, 1)[0]
          design_ui = ui_start + design_ui + ui_end

          screen_start = "@Composable\ninternal fun ActivationScreen("
          screen_end = "private data class ActivationResponse("
          before = current.split(screen_start, 1)[0]
          after = screen_end + current.split(screen_end, 1)[1]
          current = before + design_ui + "\n\n" + after

          file_path.write_text(current, encoding="utf-8")
          PY

          mkdir -p app/src/main/res/drawable
          git show "$DESIGN_COMMIT:app/src/main/res/drawable/eagle_x_activation_logo.png" > app/src/main/res/drawable/eagle_x_activation_logo.png
          git show "$DESIGN_COMMIT:app/src/main/res/drawable/eagle_x_support_qr.png" > app/src/main/res/drawable/eagle_x_support_qr.png

          rm -f .github/workflows/apply-eagle-x2-ui-on-223.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/streamvault/app/activation/ActivationGate.kt app/src/main/res/drawable/eagle_x_activation_logo.png app/src/main/res/drawable/eagle_x_support_qr.png .github/workflows/apply-eagle-x2-ui-on-223.yml
          git commit -m "feat(activation): apply Eagle X2 pass UI to #223 baseline"
          git push origin HEAD:feature/eagle-x2-ui-on-223
